


name: Maven Build, Test and Deploy

on:
 workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Java and Maven
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # Step 3: Build Maven project
      - name: Maven Build
        run: mvn clean compile

      # Step 4: Run Unit Tests
      - name: Maven Test
        run: mvn test

      # Step 5: Package application
      - name: Maven Package
        run: mvn package -DskipTests

      # Step 6: Deploy to GitHub Packages
      - name: Maven Deploy
        run: mvn deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

